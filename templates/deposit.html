<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deposit Money | Bank Management System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>


    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            🏦 Bank Management System
        </div>

        <a href="/">
            Home
        </a>

    </nav>


    <main class="page-container wide-page">

        <section class="management-page">


            <!-- Header -->
            <div class="management-header">

                <div class="page-icon">
                    💰
                </div>

                <h1>
                    Deposit Money
                </h1>

                <p>
                    Add money securely to an existing bank account.
                </p>

            </div>


            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="alert {{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <!-- Deposit Form -->
            <form method="POST" class="bank-form">


                <!-- Account Number -->
                <div class="input-group">

                    <label for="account_no">
                        Account Number
                    </label>

                    <input
                        type="text"
                        id="account_no"
                        name="account_no"
                        placeholder="Enter account number"
                        inputmode="numeric"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- Amount -->
                <div class="input-group">

                    <label for="amount">
                        Deposit Amount
                    </label>

                    <div class="amount-input">

                        <span>
                            ₹
                        </span>

                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            placeholder="Enter deposit amount"
                            min="1"
                            step="1"
                            required
                        >

                    </div>

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    class="primary-button"
                >
                    💰 Deposit Money
                </button>


            </form>


            <!-- Back -->
            <a href="/" class="back-link">
                ← Back to Dashboard
            </a>


        </section>

    </main>


</body>

</html>
