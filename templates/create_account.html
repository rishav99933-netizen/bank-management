<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d4f82;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #ffe5e5;
            color: #b00000;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #1769aa;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Create Bank Account</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
        >

        <label for="phone_no">Phone Number</label>
        <input
            type="text"
            id="phone_no"
            name="phone_no"
            placeholder="Enter 10 digit phone number"
            maxlength="10"
            required
        >

        <label for="address">Address</label>
        <textarea
            id="address"
            name="address"
            placeholder="Enter your address"
            required
        ></textarea>

        <label for="account_type">Account Type</label>

        <select id="account_type" name="account_type" required>
            <option value="">-- Select Account Type --</option>
            <option value="saving">Saving</option>
            <option value="current">Current</option>
        </select>

        <button type="submit">
            Create Account
        </button>

    </form>

    <a href="/" class="back">← Back to Home</a>

</div>

</body>
</html>
